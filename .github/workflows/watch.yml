name: BeaconWatch — Alert Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install nodemailer

      - name: Run alert check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
        run: node scripts/check-alerts.js

      - name: Commit updated state
        run: |
          git config user.name "beaconwatch-bot"
          git config user.email "actions@github.com"
          git add state/seen-alerts.json state/alerts-log.json
          git diff --cached --quiet || git commit -m "Update alert state"
          git push
