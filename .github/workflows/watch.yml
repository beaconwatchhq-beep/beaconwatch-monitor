name: BeaconWatch — Alert Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two monitor runs overlap — a queued run would double-commit state
# and could race the push. Let the in-progress run finish; drop the extra.
concurrency:
  group: beaconwatch-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # check-alerts.js only monitors + logs (no email/SMS), so no npm deps
      # and no mail secrets are needed here. Delivery lives in the digest job.
      - name: Run alert check
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: node scripts/check-alerts.js

      - name: Commit updated state
        run: |
          git config user.name "beaconwatch-bot"
          git config user.email "actions@github.com"
          git add state/seen-alerts.json state/alerts-log.json
          git diff --cached --quiet || git commit -m "Update alert state"
          git push
